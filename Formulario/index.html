<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Formulario</title>
</head>

<body>

    <h1 align="center">Formulario</h1>

    <form>

        <table border="1" align="center" cellpadding="10" width="50%">

            <!-- DATOS BÁSICOS -->
            <tr>
                <td colspan="2" align="center">
                    <b>Datos Básicos</b>
                </td>
            </tr>

            <tr>
                <td>Nombre completo:</td>
                <td><input type="text" required></td>
            </tr>

            <tr>
                <td>Edad:</td>
                <td><input type="number" min="0" required></td>
            </tr>

            <tr>
                <td>Correo electrónico:</td>
                <td><input type="email" required></td>
            </tr>

            <!-- GÉNERO -->
            <tr>
                <td>Género:</td>
                <td>
                    <input type="radio" name="genero"> Masculino<br>
                    <input type="radio" name="genero"> Femenino<br>
                    <input type="radio" name="genero"> Otro
                </td>
            </tr>

            <!-- HOBBIES -->
            <tr>
                <td>Hobbies:</td>
                <td>
                    <input type="checkbox"> Hacer Deporte<br>
                    <input type="checkbox"> Escuchar Música<br>
                    <input type="checkbox"> Jugar Videojuegos<br>
                    <input type="checkbox"> Lectura
                </td>
            </tr>

            <!-- CIUDAD -->
            <tr>
                <td>Ciudad:</td>
                <td>
                    <select>
                        <option>Seleccione una opción</option>
                        <option>Flandes</option>
                        <option>Girardot</option>
                        <option>Espinal</option>
                        <option>Otro</option>
                    </select>
                </td>
            </tr>

            <!-- DESCRIPCIÓN -->
            <tr>
                <td>Descripción:</td>
                <td>
                    <textarea rows="4" cols="30" placeholder="Escribe algo sobre ti..."></textarea>
                </td>
            </tr>

            <!-- BOTONES -->
            <tr>
                <td colspan="2" align="center">
                    <input type="submit" value="Enviar">
                    <input type="reset" value="Limpiar">
                </td>
            </tr>

        </table>

    </form>

</body>
</html>
